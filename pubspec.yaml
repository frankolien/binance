name: binance
description: "Binance Lite + Pro clone — Flutter, bloc, auto_route, clean architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Routing
  auto_route: ^9.2.2

  # DI
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0

  # Serialization / models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional error handling
  dartz: ^0.10.1

  # Storage
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # UI
  flutter_svg: ^2.0.14
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  fl_chart: ^0.69.0

  # Utils
  intl: ^0.19.0
  decimal: ^3.0.2
  logger: ^2.4.0
  phosphor_flutter: ^2.1.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Codegen
  build_runner: ^2.4.13
  auto_route_generator: ^9.0.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  hive_ce_generator: ^1.7.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/lottie/
    - .env

  fonts:
    - family: BinancePlex
      fonts:
        - asset: assets/fonts/BinancePlex-Light.otf
          weight: 300
        - asset: assets/fonts/BinancePlex-Regular.otf
          weight: 400
        - asset: assets/fonts/BinancePlex-Medium.otf
          weight: 500
        - asset: assets/fonts/BinancePlex-SemiBold.otf
          weight: 600
        - asset: assets/fonts/BinancePlex-Black.otf
          weight: 900
